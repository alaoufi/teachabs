name: Review offline administration APK on Android
run-name: Native Android review · ${{ github.sha }}

on:
  push:
    branches:
      - codex/admin-kvm-review-approved-015
    paths:
      - .github/workflows/admin-preview-review.yml
      - ci/capture-admin-preview.py

permissions:
  contents: read
  actions: read

concurrency:
  group: admin-native-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-review:
    # The user's approval covers this branch's initial review, not future pushes.
    if: github.repository == 'alaoufi/teachabs' && github.event.repository.private == false && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    # Phase limits total 50 minutes; reserve time for stop/ACL restore/upload.
    # This prepared branch does not match the trigger above. A new approval is required before another KVM run.
    timeout-minutes: 60
    env:
      REVIEW_SOURCE: 72cda6b1b90977d50a90c28bff5de36065f9e01e
      REVIEW_APK_SHA256: 79e8113e809cd6945f5ae5dc4185063c1e1aafd65ef51cedeadcc52247bb54b3
      EMULATOR_IMAGE: system-images;android-34;google_apis;x86_64
    steps:
      - name: Check out review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact existing review candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-preview-72cda6b1b90977d50a90c28bff5de36065f9e01e
          run-id: 42217465919
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/review-candidate/

      - name: Confirm exact APK bytes and initialize evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-review-diagnostics" "$RUNNER_TEMP/review-avds"
          APK="$RUNNER_TEMP/review-candidate/teachabs-admin-preview-${REVIEW_SOURCE:0:12}.apk"
          echo "$REVIEW_APK_SHA256  $APK" | sha256sum --check -
          echo "REVIEW_APK=$APK" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/review-avds" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          {
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
            id
            ls -l /dev/kvm || true
            echo 'One approved review: temporary KVM ACL for this runner user only; original ACL will be restored.'
          } > "$RUNNER_TEMP/native-review-diagnostics/host.txt"

      - name: Install missing emulator runtime library from Ubuntu repositories
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/native-review-diagnostics/apt-update.log" 2>&1
          sudo apt-get install -y --no-install-recommends libpulse0 acl \
            > "$RUNNER_TEMP/native-review-diagnostics/apt-install.log" 2>&1

      - name: Install official emulator packages only if licenses are already accepted
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Closed stdin never accepts a new agreement. Do not use --licenses or yes.
          timeout 600 "$SDKMANAGER" --install emulator "$EMULATOR_IMAGE" </dev/null \
            > "$RUNNER_TEMP/native-review-diagnostics/sdk-install.log" 2>&1
          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/package.xml"
          "$ANDROID_HOME/emulator/emulator" -version > "$RUNNER_TEMP/native-review-diagnostics/emulator-version.txt" 2>&1

      - name: Grant the approved temporary KVM access to this runner user only
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          getfacl -p /dev/kvm > "$RUNNER_TEMP/native-review-diagnostics/kvm-acl.before"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          getfacl -p /dev/kvm > "$RUNNER_TEMP/native-review-diagnostics/kvm-acl.granted"
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check \
            > "$RUNNER_TEMP/native-review-diagnostics/acceleration-check.txt" 2>&1

      - name: Create disposable emulator and boot with approved acceleration
        shell: bash
        run: |
          set -euo pipefail
          # This answers only the custom hardware-profile question, not a license prompt.
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name teachabs-review --package "$EMULATOR_IMAGE" --device pixel_2 \
            > "$RUNNER_TEMP/native-review-diagnostics/avd-create.log" 2>&1
          nohup "$ANDROID_HOME/emulator/emulator" @teachabs-review -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader \
            -accel on -memory 2048 -cores 2 -camera-back none -camera-front none \
            > "$RUNNER_TEMP/native-review-diagnostics/emulator.log" 2>&1 &
          emulator_pid=$!
          echo "EMULATOR_PID=$emulator_pid" >> "$GITHUB_ENV"
          ADB="$ANDROID_HOME/platform-tools/adb"
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -n 80 "$RUNNER_TEMP/native-review-diagnostics/emulator.log" >&2
              exit 1
            fi
            boot=$(timeout 15 "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$boot" = 1 ]; then
              "$ADB" -s emulator-5554 shell input keyevent 82
              "$ADB" -s emulator-5554 shell getprop > "$RUNNER_TEMP/native-review-diagnostics/device-properties.txt"
              exit 0
            fi
            sleep 10
          done
          echo 'Accelerated emulator did not finish booting within five minutes.' >&2
          exit 1

      - name: Capture all 171 native route and accessibility configurations
        shell: bash
        run: |
          timeout --signal=INT 2100 python3 ci/capture-admin-preview.py \
            --serial emulator-5554 --apk "$REVIEW_APK" \
            --expected-revision "$REVIEW_SOURCE" \
            --output "$RUNNER_TEMP/admin-native-evidence"

      - name: Collect diagnostics and stop disposable emulator
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-review-diagnostics"
          timeout 20 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d \
            > "$RUNNER_TEMP/native-review-diagnostics/logcat.txt" 2>&1 || true
          timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
          if [ -n "${EMULATOR_PID:-}" ]; then kill "$EMULATOR_PID" 2>/dev/null || true; fi

      - name: Restore and verify the original KVM permissions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-review-diagnostics"
          if [ -n "${EMULATOR_PID:-}" ]; then
            for attempt in $(seq 1 10); do
              if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$EMULATOR_PID" 2>/dev/null; then kill -KILL "$EMULATOR_PID" 2>/dev/null || true; fi
          fi
          BEFORE="$RUNNER_TEMP/native-review-diagnostics/kvm-acl.before"
          if [ -f "$BEFORE" ]; then
            sudo setfacl --restore="$BEFORE"
            getfacl -p /dev/kvm > "$RUNNER_TEMP/native-review-diagnostics/kvm-acl.restored"
            diff -u "$BEFORE" "$RUNNER_TEMP/native-review-diagnostics/kvm-acl.restored"
            echo 'original-kvm-acl-restored-and-verified' > "$RUNNER_TEMP/native-review-diagnostics/kvm-restoration.txt"
          else
            echo 'no-kvm-acl-grant-performed' > "$RUNNER_TEMP/native-review-diagnostics/kvm-restoration.txt"
          fi

      - name: Save native report and partial failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-admin-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/admin-native-evidence/capture-report.json
            ${{ runner.temp }}/native-review-diagnostics/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false

      - name: Save 320 dp screenshots and Android accessibility trees
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-admin-320dp-${{ github.sha }}
          path: ${{ runner.temp }}/admin-native-evidence/w320-*
          retention-days: 3
          if-no-files-found: warn

      - name: Save 360 dp screenshots and Android accessibility trees
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-admin-360dp-${{ github.sha }}
          path: ${{ runner.temp }}/admin-native-evidence/w360-*
          retention-days: 3
          if-no-files-found: warn

      - name: Save 393 dp screenshots and Android accessibility trees
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-admin-393dp-${{ github.sha }}
          path: ${{ runner.temp }}/admin-native-evidence/w393-*
          retention-days: 3
          if-no-files-found: warn

      - name: Record review limits
        if: always()
        shell: bash
        run: |
          {
            echo '## Native APK review evidence, not release approval'
            echo "APK source: $REVIEW_SOURCE"
            echo "APK SHA-256: $REVIEW_APK_SHA256"
            echo 'The exact existing APK is used without enabling JavaScript or WebView debugging.'
            echo 'Read capture-report.json for completed cases and failures. Partial evidence is not a pass.'
            echo 'Accessibility rectangles are not glyph measurements. Screenshots need visual review.'
            echo 'Only the approved temporary KVM ACL was granted. Check kvm-restoration.txt and the restore step for removal.'
            echo 'No paid resources, persistent credentials or new SDK license acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
