name: Build side-by-side administration preview
run-name: Independent preview · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - codex/admin-sidecar-preview-018

# No deployment, repository writes, secrets, or persistent signing credentials.
permissions:
  contents: read

concurrency:
  group: admin-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'alaoufi/teachabs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check preinstalled Android SDK and Java
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
          node --version

      # The offline generator and these tests use Node built-ins only.
      # Keep unrelated classroom dependencies and their lockfile untouched.
      - name: Run administration, school and offline-preview tests
        run: node --test test/admin*.test.mjs test/school*.test.mjs

      - name: Build the isolated offline preview
        shell: bash
        run: |
          set -euo pipefail
          bash android/gradlew -p admin-preview-android --no-daemon \
            -Pandroid.builder.sdkDownload=false :app:assembleDebug

      - name: Verify APK identity, signature and packaged offline assets
        run: python3 ci/verify-admin-preview.py

      - name: Save verified preview and provenance for seven days
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-preview-${{ github.sha }}
          path: ${{ runner.temp }}/admin-preview-delivery/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

      - name: Record download and installation limits
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## Offline administration preview'
            echo "Source commit: $GITHUB_SHA"
            echo "[Download verified preview artifact]($ARTIFACT_URL)"
            echo 'Read-only synthetic preview. No server URL, account or real database.'
            echo 'Debug signed with a temporary runner key, not a production signing key.'
            echo 'Independent one-off package app.teachabs.adminpreview.sidecar018. Keep existing apps and data.'
            echo 'This contains 19 static preview pages; the new individual teacher/student assignment route is not included.'
            echo 'Future stable-signed previews will use a separate channel after authorized signing-key setup.'
            echo 'No Android device/emulator runtime test was performed by this workflow.'
            echo 'Artifacts expire after seven days; source and build instructions remain in Git.'
          } >> "$GITHUB_STEP_SUMMARY"
