plugins { id 'com.android.application' }
android {
    namespace 'app.teachabs.adminpreview'
    compileSdk 34
    defaultConfig {
        applicationId 'app.teachabs.adminpreview.sidecar018'
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName '0.1.8-sidecar-preview'
    }
}
// Generate only synthetic, read-only assets. No service URL or real database is used.
tasks.register('generatePreviewAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'admin-preview-android/generate-assets.mjs',
        new File(projectDir, 'src/main/assets').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'generatePreviewAssets' }
// This is an explicitly local debug preview, not a production distribution.
androidComponents.beforeVariants(androidComponents.selector().withBuildType('release')) { variant ->
    variant.enable = false
}
